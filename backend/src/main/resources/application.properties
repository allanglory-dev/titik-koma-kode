spring.application.name=backend
spring.profiles.active=local

spring.datasource.url=jdbc:postgresql://localhost:5432/titikkoma
spring.datasource.username=postgres

# Tabel dibuat ulang setiap aplikasi dijalankan, lalu diisi dari seed/content.json.
# Aman untuk sekarang karena seluruh materi berasal dari berkas itu dan progres
# belajar disimpan di browser. Setelah ada data pengguna yang sungguhan, ganti ke
# validate dan kelola perubahan tabel lewat migrasi.
spring.jpa.hibernate.ddl-auto=create
# Tampilkan perintah SQL di log, berguna saat belajar
spring.jpa.show-sql=true